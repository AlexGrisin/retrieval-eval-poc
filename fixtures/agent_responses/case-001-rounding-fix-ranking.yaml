status: answered
answer: >-
  Tier boundaries were rounding down, drifting one cent below the agreed tier
  price. Story PAAS-202 tracked the fix to round half-up; the tier-config-cache
  design doc records that the /v1/tiers API now enforces half-up rounding to
  whole cents.
