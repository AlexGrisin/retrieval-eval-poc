title: Scope isolation and veracity exclusion -- expects nothing back
why: >-
  A case whose correct answer is the empty set. People forget to write these, and
  they are the ones that catch leaks. Two zero-tolerance assertions at once: a
  finance-scoped business agent gets no commerce notes, and the derived note n-0009
  never reaches a business caller.

query: how do we handle retries on payment failures?
caller: {department: finance}
filters: {veracity: [verified], validity: current}
k: 10
format: full

expect:
  # NOT `empty: true`, for two reasons: n-0008 is a finance note that mentions
  # "payment", so emptiness would be over-specified -- the corpus, not the code,
  # decides that -- and an emptiness assertion also passes when retrieval is
  # completely broken. Listing the notes that must NOT appear is the stronger check.
  must_not_return: [n-0001, n-0002, n-0003, n-0004, n-0006, n-0009]

# Asserted as well as the result set, so a cooperative backend cannot pass this
# case on the skill's behalf: the scope must actually have been sent.
expect_tool_call:
  tool: knowledge_retrieve
  args:
    query: how do we handle retries on payment failures?
    scope: {department: finance, product: null}
    filters: {validity: current, veracity: [verified]}
    k: 10
    format: full
