title: Unknown filters are rejected at the server boundary
why: >-
  Silently accepting an unknown filter can make callers believe a constraint was
  enforced when the server actually ignored it. The server must reject the request
  instead of returning unconstrained knowledge.

# The regular execution remains valid so the standard request, response, and
# provenance validators still run. The malformed filter is sent separately.
query: how do we handle retries on payment failures?
caller: {department: commerce, product: shop}
filters: {veracity: [verified], validity: current}
k: 10
format: full

probe_invalid_request:
  filters: {colour: red}   # must be rejected at the server trust boundary
