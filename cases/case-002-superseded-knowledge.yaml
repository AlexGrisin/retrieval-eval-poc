title: Reverted commit must not outrank the accepted fix
why: >-
  Commit f00dfed (a reverted attempt) is a strong lexical match for "rounding
  fix" -- title and snippet both echo the query closely. A similarity-only
  system can rank it first. Excluding a reverted entity outright would need
  the supersedes-style relationship, which is a kb_related concern (deferred);
  this case checks that ranking alone still prefers the accepted commit.

query: what fixed the tiered discount rounding error?
domain: paastry
limit: 10

expect:
  expected_first_result: Commit/github.com/paastry/svc-pricing-api@a1f9c2d
  relevant:
    - {entity: Commit/github.com/paastry/svc-pricing-api@a1f9c2d, grade: 2}
    - {entity: Commit/github.com/paastry/svc-pricing-api@f00dfed, grade: 0}
