title: Blank queries are rejected at the server boundary
why: >-
  An empty or whitespace-only query has no retrieval intent and should fail as an
  invalid request rather than consume server work or return arbitrary knowledge.

# The regular execution remains valid so the global request, response, and provenance
# validators still run. The deliberately invalid query is sent separately, directly to
# the server, by probe_invalid_request.
query: how do we handle retries on payment failures?
caller: {department: commerce, product: shop}
filters: {veracity: [verified], validity: current}
k: 10
format: full

probe_invalid_request:
  query: "   "
