title: Deployed skill reports tests without inventing line coverage
why: >-
  The corpus records test files but not measured line coverage. A useful answer must
  return the suite and make that limitation explicit.
query: what test coverage exists for the example-scoreboard plugin?
domain: sdp
persona: platform-engineer

expect_tool_calls:
  required:
    - tool: kb_related
      args:
        domain: sdp
        label: Feature
        key: example-scoreboard
        relationships_contains: [COVERS]
        direction: incoming
  forbidden_tools: [Bash, Read, Write, Edit, Grep, Glob, WebFetch, WebSearch]
  max_calls: 12

expect:
  required_entities:
    - Feature/example-scoreboard
    - TestSuite/github.com/ExampleCorp/example-developer-portal/plugins/example-scoreboard:testing/plugin.test.ts

answer_evaluation:
  expect:
    status: answered
    required_citations:
      - {label: Feature, key: example-scoreboard}
      - {label: TestSuite, key: "github.com/ExampleCorp/example-developer-portal/plugins/example-scoreboard:testing/plugin.test.ts"}
    required_phrases: [plugin.test.ts, line coverage is not measured]
    forbidden_phrases: [100% line coverage, full line coverage]
    requires_footer_format: true
  rubrics: [faithfulness, relevancy, answer_correctness]
  reference_answer: >-
    The example-scoreboard feature has testing/plugin.test.ts. The corpus records that the
    test file exists but does not measure line coverage.
