title: Retries question -- recall and ranking
why: >-
  The baseline metric case. Graded relevance, so nDCG can distinguish "found the
  right note" from "found it and ranked it first".

query: how do we handle retries on payment failures?
caller: {department: commerce, product: shop}
filters: {veracity: [verified], validity: current}
k: 10
format: full

expect:
  relevant:
    - {note: n-0001, version: 3, grade: 2}   # the actual answer
    - {note: n-0002, version: 1, grade: 1}   # useful background
    - {note: n-0003, version: 2, grade: 1}   # useful background
  must_not_return:
    - n-0004        # superseded by n-0001
    - n-0009        # derived, not reviewed; filter says verified only

answer_evaluation:
  expect:
    status: answered
    required_citations:
      - {note_id: n-0001, version: 3}
      - {note_id: n-0002, version: 1}
      - {note_id: n-0003, version: 2}
    must_not_cite:
      - {note_id: n-0004, version: 1}
      - {note_id: n-0009, version: 1}
  rubrics: [faithfulness, relevancy, answer_correctness]
  reference_answer: >-
    Only retryable payment failures may be retried. Settlement retries must reuse the
    original idempotency key, and downstream retry budgets stop further attempts when
    exhausted.
