title: Deployed skill traces a commit through its pull request to the story
why: >-
  A search-only surrogate cannot prove the commit-to-pull-request-to-story graph
  recipe or that the skill fetches the story before explaining the change.
query: why was packages/app/src/App.tsx changed in commit de715cc45970?
domain: sdp
persona: platform-engineer

expect_tool_calls:
  required:
    - tool: kb_related
      args:
        domain: sdp
        label: Commit
        key: github.com/ExampleCorp/example-developer-portal/packages/app@de715cc45970
        direction: outgoing
        depth_at_least: 2
    - tool: kb_fetch
      args:
        domain: sdp
        label: Story
        key: DE-1141
  forbidden_tools: [Bash, Read, Write, Edit, Grep, Glob, WebFetch, WebSearch]
  max_calls: 10

expect:
  required_entities:
    - Story/DE-1141
    - PullRequest/github.com/ExampleCorp/example-developer-portal/packages/app#391

answer_evaluation:
  expect:
    status: answered
    required_citations:
      - {label: Story, key: DE-1141}
      - {label: PullRequest, key: "github.com/ExampleCorp/example-developer-portal/packages/app#391"}
    required_phrases: [context caching, homepage data, DE-1141, Jira, not connected]
    forbidden_phrases: [React.lazy, code splitting, custom plugin routes]
    requires_footer_format: true
  rubrics: [faithfulness, relevancy, answer_correctness]
  reference_answer: >-
    Commit de715cc45970 was merged through pull request 391, which carries DE-1141.
    The recorded rationale recovered from commit messages is app-level React context
    caching for homepage data, including consolidating staleness listeners and
    memoizing the context value. Jira is not connected, and pull-request membership
    was recovered through the Jira key rather than directly from git.
