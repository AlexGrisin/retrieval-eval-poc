[project]
name = "retrieval-eval"
version = "0.1.0"
description = "End-to-end evaluation of the deployed okf-knowledge skill"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    # Loads local live-judge settings from an ignored .env file. Project-local values
    # are authoritative when the file exists; CI without that file uses its environment.
    "python-dotenv>=1,<2",
    # The LLM judge Gateway client (harness/judges/gateway.py).
    "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    # Renders the case:level:check hierarchy as Allure suites/sub-suites/stories,
    # with the retrieval trace, ranking metrics, and judge verdicts attached per
    # test. Pure reporting; adds no assertions and never gates a run.
    #
    # Pinned to the 2.13 line to match the local `allure` commandline (2.13.8):
    # allure-pytest 2.16 emits a `titlePath` result field the 2.13 commandline's
    # older report-model parser rejects, silently dropping every result from the
    # generated report. If the commandline is upgraded, this pin can move too --
    # check `allure --version` against https://github.com/allure-framework/allure2
    # release notes before bumping.
    "allure-pytest==2.13.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "framework: tests the evaluation instrument without calling a live target",
    "agent_target: evaluates the deployed okf-knowledge skill against the real Knowledge Server",
    "traced: check is backed by an approved requirement",
    "inferred: check follows from implementation intent but is not yet approved",
    "unratified: check or contract still requires approval",
    "untraceable: check has no traceable source and must fail validation",
    "judge: evaluation calls the configured live LLM judge",
    "evaluation: evaluates a declared case against the selected target",
    "case_check(case_id, level): public metadata used to order case evaluation stages",
]
# No retry-on-failure plugins by design: nondeterminism is an evaluation finding.
